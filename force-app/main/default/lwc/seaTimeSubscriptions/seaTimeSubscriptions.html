<template>
    
    <section class={mainSectionSelector}>
        <div if:true={isLoading} class="slds-is-relative spinner-container">
            <lightning-spinner alternative-text="Loading..." variant="brand"></lightning-spinner>
        </div>

        <template lwc:if={showModal}>
            <section class="container-section">
                <p class="boat-certificate-required">{wantToCancel}</p>
                <section class="footer-section">
                    <button class="slds-button slds-button_brand moderate-button search-button" onclick={handleApprove}>{labels.confirm}</button>
                    <button class="slds-button slds-button_brand dark-button search-button" onclick={handleCloseModal}>{labels.cancelLabel}</button>
                </section>
            </section>
            <div class="slds-backdrop slds-backdrop_open" role="presentation"></div>
        </template>

        <div class={mainCard} dir={dir}>
            <!-- Premium Header / Details -->
            <template lwc:if={subscriptionsData.length} for:each={subscriptionsData} for:item="sub">
                <template lwc:if={sub.showSubscriptionDetails}>
                    <div key={sub.id} class="subscription-header-panel">
                        <div class="header-row">
                            <h1 class="premium-title">{labels.subscriptionDetails}</h1>
                            <div class="total-points-badge">
                                <span class="badge-label">{labels.totalPointsPurchased}:</span>
                                <span class="badge-value">{sub.subscription.Total_Points__c}</span>
                            </div>
                        </div>

                        <div class="details-grid">
                            <div class="detail-item">
                                <span class="detail-label">{labels.startDate}:</span>
                                <span class="detail-value">{sub.subscription.startDate}</span>
                            </div>
                            <div class="detail-item">
                                <span class="detail-label">{labels.endDate}:</span>
                                <span class="detail-value">{sub.subscription.endDate}</span>
                            </div>
                            <div class="detail-item highlight">
                                <span class="detail-label">{labels.pointsRemained}:</span>
                                <span class="detail-value">{sub.subscription.Points_Balance__c}</span>
                            </div>
                            <div class="detail-item">
                                <span class="detail-label">{labels.pointsUsed}:</span>
                                <span class="detail-value">{sub.subscription.Used_Points__c}</span>
                            </div>
                        </div>

                        <!-- Additional Info Bar -->
                        <template lwc:if={sub.subscription.Extra_Subscription_Details__c}>
                            <div class="subscription-info-bar slds-m-top_large" key={sub.id}>
                                <div class="info-content-wrapper slds-grid slds-grid_vertical-align-center">
                                    <lightning-icon icon-name="utility:info" size="small" variant="brand" class="slds-m-left_small"></lightning-icon>
                                    <div>
                                        <span class="info-bar-label">{labels.extraSubscriptionDetails}:</span>
                                        <span class="info-bar-value slds-m-right_x-small">
                                            <lightning-formatted-text value={sub.subscription.Extra_Subscription_Details__c}></lightning-formatted-text>
                                        </span>
                                    </div>
                                </div>
                            </div>
                        </template>
                    </div>
                </template>
            </template>

            <!-- Student Header -->
            <template lwc:if={subscriptionsData.length} for:each={subscriptionsData} for:item="studentSub">
                <template lwc:if={studentSub.isStudent}>
                    <div key={studentSub.id} class="subscription-header-panel">
                        <div class="header-row">
                            <h1 class="premium-title">פירוט ההפלגות שלי</h1>
                        </div>
                    </div>
                </template>
            </template>

            <!-- Redesigned Tabs -->
            <template lwc:if={showTabs}>
                <div class="premium-tabs-container">
                    <div class="premium-tabs">
                        <template lwc:if={showPrivateTab}>
                            <button class={tabPrivateClass} onclick={handleClick} title={labels.privateOrders}>
                                {labels.privateOrders}
                                <template if:true={privateOrderPoints}>
                                    <span class="points-count">({privateOrderPoints} {labels.points})</span>
                                </template>
                            </button>
                        </template>
                        <button class={tabGuidedClass} onclick={handleClick} title={labels.guidedOrders}>
                            {labels.guidedOrders}
                            <template if:true={guidedOrderPoints}>
                                <span class="points-count">({guidedOrderPoints} {labels.points})</span>
                            </template>
                        </button>
                    </div>
                </div>
            </template>

            <!-- Orders List -->
            <div class="orders-content slds-p-horizontal_medium slds-p-bottom_medium">
                <template lwc:if={subscriptionsData.length}>
                    <template lwc:if={displayCruiseOrder}>
                        <!-- Private Orders -->
                        <div class="orders-list">
                            <template for:each={subscriptionsData} for:item="sub">
                                <template lwc:if={sub.cruise.length}>
                                    <template for:each={sub.cruise} for:item="cruise">
                                        <div key={cruise.Id} class="order-item-card">
                                            <div class="order-row main-row">
                                                <div class="order-col date">{cruise.startDate}</div>
                                                <div class="order-col time"><span dir="ltr">{cruise.startTime} - {cruise.endTime}</span></div>
                                                <div class="order-col boat">{cruise.boatName}</div>
                                                <div class="order-col points">{cruise.Cruise_Points__c} {labels.points}</div>
                                            </div>
                                        </div>
                                    </template>
                                </template>
                                <template lwc:else>
                                    <p key={sub.id} class="no-records">{labels.noRecordsFound}</p>
                                </template>
                            </template>
                        </div>
                    </template>
                    <template lwc:else>
                        <!-- Guided Orders -->
                        <div class="orders-list">
                            <template for:each={subscriptionsData} for:item="sub">
                                <template lwc:if={sub.coCruiseSailres.length}>
                                    <template for:each={sub.coCruiseSailres} for:item="cmember">
                                        <div key={cmember.Id} class="order-item-card">
                                            <div class="order-row main-row">
                                                <div class="order-col date">{cmember.cruiseDate}</div>
                                                <div class="order-col type">{cmember.sailTypeVal}</div>
                                                <div class="order-col info">{cmember.extraInfo}</div>
                                                <div class="order-col points">{cmember.Cruise_Points__c} {labels.points}</div>
                                            </div>
                                        </div>
                                    </template>
                                </template>
                                <template lwc:else>
                                    <p key={sub.id} class="no-records">{labels.noRecordsFound}</p>
                                </template>
                            </template>
                        </div>
                    </template>

                    <div class="show-more-panel slds-text-align_center" if:false={isHideMore}>
                        <button class="show-more-btn" onclick={handleMore}>{labels.showOrderHistory}</button>
                    </div>
                </template>
                <template lwc:else>
                    <div class="no-data-msg slds-align_absolute-center slds-m-top_large">
                        <p class="premium-text">לא נמצאו נתוני מנוי עבור חשבון זה.</p>
                    </div>
                </template>
            </div>
        </div>
    </section>
</template>
