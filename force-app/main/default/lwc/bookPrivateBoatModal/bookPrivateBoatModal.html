<template>

    <section class="container-section">

            <template lwc:if={showSpinner}>
                <lightning-spinner alternative-text="Loading" variant="brand">
                </lightning-spinner>
                <div class="slds-backdrop slds-backdrop_open" role="presentation"></div>
            </template>

                <template lwc:if={boatReserved}>
                    <p class="booking-confirmation-verbiage" dir="rtl">
                        {boatReserved}
                    </p>
                </template>
                 <template lwc:else>
                        <p dir="rtl" class="header">{sailingDetails}</p>
                        <section class="boat-details">
                            <div class="boat-detail-values">
                                <p>{selectedBoat.formattedDate}</p>
                                <p>{selectedBoat.name}</p>
                                <p>{selectedBoat.boatType}</p>
                                <p>{selectedBoat.startTime}</p>
                                <p>{selectedBoat.endTime}</p>
                                <p>{selectedBoat.price}</p>
                            </div>
                            <div class="headers">
                                <p>{date}</p>
                                <p>{nameOfTheBoat}</p>
                                <p>{typeOfTheBoat}</p>
                                <p>{startTime}</p>
                                <p>{endTime}</p>
                                <p>{cruiseValue}</p>
                            </div>
                        </section>
                        <template lwc:if={selectedBoat.blockReason}>
                            <p class="booking-confirmation-verbiage slds-text-color_error slds-m-top_medium" dir="rtl">
                                {selectedBoat.blockReason}
                            </p>
                            <template lwc:if={selectedBoat.isContractMissing}>
                                <div class="slds-m-top_medium slds-text-align_center" dir="rtl">
                                    <template lwc:if={contractSent}>
                                        <div class="slds-notify slds-notify_alert slds-alert_success slds-m-top_small" role="alert" style="border-radius: 6px; padding: 10px 16px; background-color: #e0f2f1; color: #004d40; border: 1px solid #009688; font-size: 1rem; font-weight: 500;">
                                            <span>התקנון נשלח אליכם למייל לחתימה, לאחר מכן תוכלו לחזור ולהזמין את היאכטה</span>
                                        </div>
                                    </template>
                                    <template lwc:else>
                                        <button class="slds-button slds-button_brand moderate-button search-button" onclick={handleGenerateContract}>
                                            להפקת תקנון לחצו כאן
                                        </button>
                                    </template>
                                </div>
                                <template lwc:if={contractError}>
                                    <p class="slds-text-color_error slds-text-align_center slds-m-top_small" dir="rtl">{contractError}</p>
                                </template>
                            </template>
                        </template>
                        <template lwc:else>
                            <template lwc:if={selectedBoat.isdisable}>
                                <p class="booking-confirmation-verbiage slds-text-color_error slds-m-bottom_small" dir="rtl">
                                    אין לך הסמכה על היאכטה, ביכולתך להזמין הפלגה בליווי מדריך (בתוספת תשלום לפי מחירון המועדון)
                                </p>
                            </template>
                            <div dir={dir} class="slds-m-bottom_small">
                                <lightning-input type="checkbox" label={needSkipperLabel} checked={needSkipper} disabled={selectedBoat.isdisable} onchange={handleNeedSkipperChange}></lightning-input>
                            </div>
                            <div dir={dir}>
                                <lightning-input type="text" label={additionalInfo} onchange={handleInput} placeholder={aiPlaceHolder} max-length=255 ></lightning-input>
                            </div>
                        </template>
                    </template> 
                 <section class="footer-section" dir={dir}>
                    <template lwc:if={selectedBoat.blockReason}>
                        <!-- Hide confirm button if blocked -->
                    </template>
                    <template lwc:else>
                        <button if:false={boatReserved} class="slds-button slds-button_brand moderate-button search-button" onclick={handleApprove}>
                            {confirm}
                        </button>
                    </template>
                    <button if:false={boatReserved} class="slds-button slds-button_brand dark-button search-button" onclick={handleCloseModal}>
                        {cancel}
                    </button>
                </section> 
         <template lwc:if={boatReserved}>
            <section class="footer-section">
            <button class="slds-button slds-button_brand dark-button search-button" onclick={handleCloseModal}>
                    {cancel}
                </button>
            </section>
        </template> 
      
    </section>
    <div class="slds-backdrop slds-backdrop_open" role="presentation"></div>
</template>
