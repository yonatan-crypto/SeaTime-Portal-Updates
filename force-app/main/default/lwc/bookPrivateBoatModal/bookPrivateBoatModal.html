<template>

    <section class="container-section">

            <template lwc:if={showSpinner}>
                <lightning-spinner alternative-text="Loading" variant="brand">
                </lightning-spinner>
                <div class="slds-backdrop slds-backdrop_open" role="presentation"></div>
            </template>

                <template lwc:if={selectedBoat.isdisable}>
                    <p class="boat-certificate-required">{boatRequiresCertificate} </p>
                </template>
                <template lwc:elseif={boatReserved}>
                    <p class="booking-confirmation-verbiage" dir="rtl">
                        {boatReserved}
                    </p>
                </template>
                 <template lwc:else>
                        <p dir="rtl" class="header">{sailingDetails}</p>
                        <section class="boat-details">
                            <div class="boat-detail-values">
                                <p>{selectedBoat.formattedDate}</p>
                                <p>{selectedBoat.name}</p>
                                <p>{selectedBoat.boatType}</p>
                                <p>{selectedBoat.startTime}</p>
                                <p>{selectedBoat.endTime}</p>
                                <p>{selectedBoat.price}</p>
                            </div>
                            <div class="headers">
                                <p>{date}</p>
                                <p>{nameOfTheBoat}</p>
                                <p>{typeOfTheBoat}</p>
                                <p>{startTime}</p>
                                <p>{endTime}</p>
                                <p>{cruiseValue}</p>
                            </div>
                        </section>
                        <div dir={dir}>
                            <lightning-input type="text" label={additionalInfo} onchange={handleInput} placeholder={aiPlaceHolder} max-length=255 ></lightning-input>
                        </div>
                    </template> 
                 <section class="footer-section" dir={dir}>
                    <template lwc:if={selectedBoat.isdisable}>
                        <button class="slds-button slds-button_brand moderate-button search-button"
                            onclick={handleNavigateToCertificates}>
                            {certificate}
                        </button>
                    </template>
                    <template lwc:else>
                        <button if:false={boatReserved} class="slds-button slds-button_brand moderate-button search-button" onclick={handleApprove}>
                            {confirm}
                        </button>
                    </template>
                    <button if:false={boatReserved} class="slds-button slds-button_brand dark-button search-button" onclick={handleCloseModal}>
                        {cancel}
                    </button>
                </section> 
         <template lwc:if={boatReserved}>
            <section class="footer-section">
            <button class="slds-button slds-button_brand dark-button search-button" onclick={handleCloseModal}>
                    {cancel}
                </button>
            </section>
        </template> 
      
    </section>
    <div class="slds-backdrop slds-backdrop_open" role="presentation"></div>
</template>
