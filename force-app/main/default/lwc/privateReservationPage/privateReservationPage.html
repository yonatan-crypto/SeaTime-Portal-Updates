<template>
    <template lwc:if={showSpinner}>
        <lightning-spinner alternative-text="Loading" variant="brand"></lightning-spinner>
        <div class="slds-backdrop slds-backdrop_open" role="presentation"></div>
    </template>

    <section class={mainSectionSelector}>

        <!-- BOOKING MODAL - MUST be at top level so it overlays everything -->
        <template lwc:if={showBookBoatModal}>
            <c-book-private-boat-modal 
                selected-boat={selectedBoat} 
                boat-reserved={boatReserved}
                onclose={handleShowBookModal} 
                onapprove={handleApprovePrivateReservation}>
            </c-book-private-boat-modal>
        </template>

        <!-- Top Actions & Navigation Bar (Show only when results are active) -->
        <template lwc:if={boatsArray.length}>
            <div class="top-navigation-bar slds-grid slds-grid_vertical-align-center slds-grid_align-spread slds-p-horizontal_medium slds-p-vertical_small">
                <div class="left-actions slds-grid slds-grid_vertical-align-center">
                    <button class="slds-button slds-button_brand moderate-button slds-m-right_small new-search-btn" onclick={handleNewSearch}>
                        <lightning-icon icon-name="utility:search" size="x-small" class="slds-m-right_small" variant="inverse"></lightning-icon>
                        חיפוש חדש
                    </button>
                </div>
            </div>
        </template>

        <!-- UNIFIED PORTAL CONTAINER (Desktop only styling applied in CSS) -->
        <div class="unified-portal-container">
            <!-- HORIZONTAL SEARCH BAR (3-ROW centered version) -->
            <section class="horizontal-search-section slds-m-bottom_medium" lwc:if={showSearchSection}>
                <div class="search-bar-content-unified">
                    
                    <!-- ROW 1: DATE (Centered) -->
                    <div class="search-row date-row-centered slds-grid slds-grid_align-center">
                        <div class="search-group date-group slds-grid slds-grid_vertical-align-center">
                            <button class="slds-button date-nav-btn" onclick={handlePrevDay} title="יום אחורה">
                                <lightning-icon icon-name="utility:chevronleft" size="xx-small" variant="brand"></lightning-icon>
                            </button>
                            <div class="date-picker-mini">
                                <input type="date" class="native-date-input" value={searchData.date} onchange={handleSearchDateChange} onclick={handleDateClick}>
                            </div>
                            <button class="slds-button date-nav-btn" onclick={handleNextDay} title="יום קדימה">
                                <lightning-icon icon-name="utility:chevronright" size="xx-small" variant="brand"></lightning-icon>
                            </button>
                        </div>
                    </div>

                    <!-- ROW 2: TYPES (Centered) -->
                    <div class="search-row params-row-centered slds-grid slds-grid_align-center slds-m-top_medium">
                         <!-- Boat Type Selection -->
                        <div class="search-group types-group slds-m-horizontal_medium slds-grid slds-grid_vertical-align-center">
                            <template for:each={boatTypesArray} for:item="boatType">
                                <button key={boatType.label} data-id={boatType.label} class={boatType.selector}
                                    onclick={handleBoatTypeSelected}>
                                    {boatType.label}
                                </button>
                            </template>
                        </div>
                    </div>

                    <!-- ROW 3: DURATION (Centered) -->
                    <div class="search-row duration-row-centered slds-grid slds-grid_align-center slds-m-top_medium">
                        <!-- Duration Selection -->
                        <div class="search-group duration-group slds-m-horizontal_medium slds-grid slds-grid_vertical-align-center">
                            <template for:each={boatDurationArray} for:item="boatDuration">
                                <button key={boatDuration.label} data-id={boatDuration.label} class={boatDuration.selector}
                                    onclick={handleBoatDurationSelected}>
                                    {boatDuration.label}
                                </button>
                            </template>
                        </div>
                    </div>

                    <!-- ROW 4: SUBMIT (Centered) -->
                    <div class="search-row submit-row-centered slds-grid slds-grid_align-center slds-m-top_medium">
                        <div class="search-group submit-group">
                            <button class="slds-button slds-button_brand submit-search-btn-large" disabled={disableSearchButton} onclick={handleSubmit}>
                                {submit}
                            </button>
                        </div>
                    </div>
                </div>
                <p class="error-verbiage slds-text-align_center slds-m-top_x-small" lwc:if={showInvalidDateVerbiage}>{invalidDateVerbiage}</p>
            </section>

            <section class="add-new-reservation">
                <!-- RESULTS VIEW (Boats found) -->
                <template lwc:if={boatsArray.length}>
                    <section class="search-result">
                        <section class="tile">
                            <template iterator:boat={boatsArray}>
                                <div key={boat.value.id}>
                                    <p class="start-time">{boat.value.startTime}</p>
                                    <div class="boat-scroll-container">
                                        <!-- LEFT SCROLL -->
                                        <div class="scroll-indicator scroll-left" lwc:if={boat.value.hasManyBoats} onclick={handleScrollLeft} data-time={boat.value.startTime}>
                                            <lightning-icon icon-name="utility:chevronleft" size="small" variant="inverse"></lightning-icon>
                                        </div>

                                        <div class="boat-container" dir="rtl" data-container-time={boat.value.startTime}>
                                            <template for:each={boat.value.listOfBoats} for:item="boatData">
                                                <section key={boatData.id} class={boatData.boatSelector} data-name={boatData.name}
                                                    data-start-time={boat.value.startTime} data-end-time={boat.value.endTime}
                                                    data-params={boatData.id} data-boat-id={boatData.id} data-boat-type={boatData.type}
                                                    data-isdisable={boatData.isCertificateRequired}
                                                    onclick={handleShowBookModal}>
                                                    <div class="boat-text-card">
                                                        <p class="boat-name-large">{boatData.name}</p>
                                                        <p class="boat-type-small">{boatData.type}</p>
                                                    </div>
                                                </section>
                                            </template>
                                        </div>

                                        <!-- Mobile Scroll Hint (hidden on desktop) -->
                                        <div class="mobile-scroll-hint" lwc:if={boat.value.hasManyBoats}>
                                            <lightning-icon icon-name="utility:chevronleft" size="xx-small" variant="brand"></lightning-icon>
                                        </div>

                                        <!-- RIGHT SCROLL -->
                                        <div class="scroll-indicator scroll-right" lwc:if={boat.value.hasManyBoats} onclick={handleScrollRight} data-time={boat.value.startTime}>
                                            <lightning-icon icon-name="utility:chevronright" size="small" variant="inverse"></lightning-icon>
                                        </div>
                                    </div>
                                </div>
                            </template>
                        </section>
                    </section>
                </template>

                <!-- NO RESULTS / SEARCHING STATE (Only shown if NOT in search mode but no results) -->
                <template lwc:else>
                    <template lwc:if={showSearchSection}>
                        <section class="search-result desktop-only-empty-state">
                            <span class="noRecordsStyle slds-align_absolute-center search-hint-text">
                                חפשו את היאכטה המתאימה לכם בלוח החיפוש
                            </span>
                        </section>
                    </template>
                    <template lwc:else>
                        <!-- MY RECENT RESERVATIONS (Main View) -->
                        <template lwc:if={privateReservationArray.length}>
                            <section class="search-result">
                                <section class="header-tile">
                                    <p class="next-reservation-label">{nextReservationLabel}</p>
                                </section>
                                <template for:each={privateReservationArray} for:item="cruise">
                                    <section key={cruise.Id} class="tile slds-p-around_small">
                                        <lightning-layout multiple-rows="true" vertical-align="center">
                                            <lightning-layout-item size="12" small-device-size="12" medium-device-size="4" class="slds-text-align_right">
                                                <p class="slds-text-heading_small">{cruise.startDateToDisplay}</p>
                                            </lightning-layout-item>
                                            <lightning-layout-item size="6" small-device-size="6" medium-device-size="4" class="slds-text-align_right">
                                                <p class="slds-text-color_weak">{cruise.boatType}</p>
                                                <p class="slds-text-title_bold">{cruise.boatName}</p>
                                            </lightning-layout-item>
                                            <lightning-layout-item size="6" small-device-size="6" medium-device-size="4" class="slds-text-align_left">
                                                <p class="slds-text-color_weak">
                                                    <lightning-formatted-date-time value={cruise.startDate} hour="2-digit" minute="2-digit" hour12={show12HourTime} time-zone="asia/jerusalem"></lightning-formatted-date-time>
                                                    - 
                                                    <lightning-formatted-date-time value={cruise.endTime} hour="2-digit" minute="2-digit" hour12={show12HourTime} time-zone="asia/jerusalem"></lightning-formatted-date-time>
                                                </p>
                                            </lightning-layout-item>
                                        </lightning-layout>
                                    </section>
                                </template>
                            </section>
                        </template>
                        <template lwc:else>
                            <!-- No results found after search -->
                            <section class="search-result">
                                <span class="noRecordsStyle slds-align_absolute-center search-hint-text">
                                    לא נמצאו סירות פנויות לחיפוש זה. נסו תאריך או משך זמן אחר.
                                </span>
                            </section>
                        </template>
                    </template>
                </template>
            </section>
        </div>
    </section>
</template>
