<template>

    <c-sea-time-app-navigation lwc:ref="navigation"></c-sea-time-app-navigation>

    <template lwc:if={showSpinner}>
        <lightning-spinner alternative-text="Loading" variant="brand">
        </lightning-spinner>
        <div class="slds-backdrop slds-backdrop_open" role="presentation"></div>
    </template>

    <template lwc:if={showOtpPage}>
        <section class="container-section center-align-section">
            <template lwc:if={showOtpSpinner}>
                <lightning-spinner alternative-text="Loading" variant="brand">
                </lightning-spinner>
                <div class="slds-backdrop slds-backdrop_open" role="presentation"></div>
            </template>
            <main>
                <template lwc:if={showTooManyTriesOtpVerbiage}>
                    <section class="error-message otp-error-message">
                        {tooManyTriesVerbiage}
                    </section>
                </template>
                <template lwc:elseif={showIncorrectOtpVerbiage}>
                    <section class="error-message otp-error-message">
                        {incorrectOtpVerbiage}
                    </section>
                </template>
                <p class="otp-header" dir="rtl">{otpHeaderlabel}</p>
                <lightning-input label={otpLabel} variant="label-hidden" placeholder={otpLabel} dir="rtl"
                    lwc:ref="otp-input" class="center-align-section-item otp-input" onchange={handleOtpChange}>
                </lightning-input>

                <lightning-button label={submitOtpButtonLabel} variant="brand"
                    class="center-align-section-item dark-button" stretch onclick={handleSubmitOtp}>
                </lightning-button>
            </main>
        </section>
        <div class="slds-backdrop slds-backdrop_open" role="presentation"></div>
    </template>
    <section class="center-align-section">

        <template lwc:if={isMissingCredentials}>
            <section class="error-message">
                {missingCredentialsVerbiage}
            </section>
        </template>
        <template lwc:elseif={showTooManyTriesVerbiage}>
            <section class="error-message">
                {tooManyTriesVerbiage}
            </section>
        </template>
        <template lwc:elseif={showIncorrectCredsVerbiage}>
            <section class="error-message">
                {incorrectCredentialVerbiage}
            </section>
        </template>

        <p class="center-align-section-item login-header first-header">
            {loginpageHeaderLabel}
        </p>
        <p class="center-align-section-item login-header">
            {loginpageHeaderLabel2}
        </p>

        <p class="center-align-section-item field-label">{userNameLabel}</p>

        <lightning-input label={userNamePlaceHolder} placeholder={userNamePlaceHolder} variant="label-hidden" dir="rtl"
            class="center-align-section-item" onchange={handleUserNameChange} required="true">
        </lightning-input>

        <p class="center-align-section-item field-label">{paswwordLabel}</p>

        <lightning-input label={paswwordPlaceHolder} placeholder={paswwordPlaceHolder} variant="label-hidden"
            type="password" dir="rtl" class="center-align-section-item" onchange={handlePasswordChange} required="true">
        </lightning-input>

        <lightning-button label={loginButtonLabel} variant="brand" class="center-align-section-item dark-button" stretch
            onclick={handleLogin}>
        </lightning-button>

        <lightning-button
            label={signupResetPasswordButtonLabel}
            variant="brand"
            class="center-align-section-item dark-button"
            stretch
            onclick={openResetPopup}>
        </lightning-button>

        <section class="moderate-custom-button" style={faqsStyle}>
            <div class="center-align-with-space">
                <div class="expand-button" onclick={handleShowFaqsVerbiage}>
                    <lightning-icon icon-name="utility:chevronleft" class="moderate-theme-slds-icon" size="x-small">
                    </lightning-icon>
                </div>
                <p dir="rtl">{faqsLabel}</p>
            </div>
            <template lwc:if={showFaqsVerbiage}>
                <p class="faqs-verbiage" dir="rtl">{faqsVerbiage}</p>
            </template>
        </section>
    </section>

    <template if:true={showResetPopup}>
    <section
        role="dialog"
        tabindex="-1"
        class="slds-modal slds-fade-in-open"
        aria-modal="true">
        <div class="slds-modal__container">
            <header class="slds-modal__header">
                <h2 class="slds-text-heading_medium">
                    {signupResetPasswordTitle}
                </h2>
            </header>

            <div class="slds-modal__content slds-p-around_medium">
                <lightning-input
                    label={emailLabel}
                    type="email"
                    onchange={handleResetEmailChange}>
                </lightning-input>

                <lightning-input
                    label={mobileNumberLabel}
                    type="tel"
                    onchange={handleResetMobileChange}>
                </lightning-input>
            </div>

            <footer class="slds-modal__footer">
                <lightning-button
                    label={sendOtpButtonLabel}
                    variant="brand"
                    onclick={handleResetSubmit}>
                </lightning-button>&nbsp;&nbsp;

                <lightning-button
                    label={cancelLabel}
                    variant="neutral"
                    onclick={closeResetPopup}>
                </lightning-button>
            </footer>
        </div>
    </section>

    <div class="slds-backdrop slds-backdrop_open"></div>
</template>

    <template if:true={showStrongPasswordModal}>
    <!-- MODAL -->
    <section
        role="dialog"
        tabindex="-1"
        class="slds-modal slds-fade-in-open"
        aria-modal="true">
        <div class="slds-modal__container">
            <header class="slds-modal__header">
                <h2 class="slds-text-heading_medium">
                    {createStrongPasswordTitle}
                </h2>
                
            </header>
            
            <div class="slds-modal__content slds-p-around_medium">
                <template if:true={passwordErrorMessage}>
                    <p style="color:red; font-size:0.9rem; margin-top:0.5rem;">{passwordErrorMessage}</p>
                </template>
                <lightning-input
                    type="password"
                    label={passwordLabel}
                    onchange={handlePassword1Change}>
                </lightning-input>

                <lightning-input
                    type="password"
                    label={confirmPasswordLabel}
                    onchange={handlePassword2Change}>
                </lightning-input>
            </div>

            <footer class="slds-modal__footer">
                <lightning-button
                    label={submitButtonLabel}
                    variant="brand"
                    onclick={handleSubmitStrongPassword}
                    disabled={isSubmitDisabled}>
                </lightning-button>&nbsp;&nbsp;

                <lightning-button
                    label={cancelLabel}
                    variant="neutral"
                    onclick={handleCancelStrongPassword}>
                </lightning-button>
            </footer>
        </div>
    </section>
    <div class="slds-backdrop slds-backdrop_open"></div>
</template>


</template>
