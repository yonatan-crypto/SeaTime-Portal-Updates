<template>
    <section class="container-section">
        <template lwc:if={showSpinner}>
            <lightning-spinner alternative-text="Loading" variant="brand">
            </lightning-spinner>
            <div class="slds-backdrop slds-backdrop_open" role="presentation"></div>
        </template>

        <template lwc:if={noSeatLeft}>
            <p class="booking-confirmation-verbiage" dir="rtl">
                {noSlotLeft}
            </p>
        </template>
        <template lwc:elseif={selectedCruise.isBookingNotAvailable}>
            <p class="booking-confirmation-verbiage" dir="rtl">
                <template lwc:if={selectedCruise.bookingNotAvailableReason}>
                    {selectedCruise.bookingNotAvailableReason}
                </template>
                <template lwc:else>
                    {reachOutToClub}
                </template>
            </p>
            <template lwc:if={selectedCruise.isContractMissing}>
                <div class="slds-m-top_medium slds-m-bottom_large slds-text-align_center" style="margin-bottom: 24px;" dir="rtl">
                    <template lwc:if={contractSent}>
                        <div class="slds-notify slds-notify_alert slds-alert_success slds-m-top_small" role="alert" style="border-radius: 6px; padding: 10px 16px; background-color: #e0f2f1; color: #004d40; border: 1px solid #009688; font-size: 1rem; font-weight: 500;">
                            <span>התקנון נשלח אליכם למייל לחתימה, לאחר מכן תוכלו לחזור ולהזמין את ההפלגה</span>
                        </div>
                    </template>
                    <template lwc:else>
                        <button class="slds-button slds-button_brand moderate-button search-button" onclick={handleGenerateContract}>
                            להפקת תקנון לחצו כאן
                        </button>
                    </template>
                </div>
                <template lwc:if={contractError}>
                    <p class="slds-text-color_error slds-text-align_center slds-m-top_small" dir="rtl">{contractError}</p>
                </template>
            </template>
        </template>
        <template lwc:else>
            <p class="booking-confirmation-verbiage" dir="rtl">
                {clubCruiseBookingLabel}
            </p>
        </template>
        <section class="footer-section">
            <template lwc:if={showConfirmButton}>
                <button class="slds-button slds-button_brand moderate-button search-button" onclick={handleConfirm}>
                    {confirm}
                </button>
            </template>
            <button class="slds-button slds-button_brand dark-button search-button" onclick={handleCloseModal}>
                {cancel}
            </button>
        </section>
    </section>
    <div class="slds-backdrop slds-backdrop_open" role="presentation"></div>
</template>
