<template>
    <section class="container-section">
        <template lwc:if={showSpinner}>
            <lightning-spinner alternative-text="Loading" variant="brand">
            </lightning-spinner>
            <div class="slds-backdrop slds-backdrop_open" role="presentation"></div>
        </template>

        <template lwc:if={noSeatLeft}>
            <p class="booking-confirmation-verbiage" dir="rtl">
                {noSlotLeft}
            </p>
        </template>
        <template lwc:elseif={selectedCruise.isBookingNotAvailable}>
            <p class="booking-confirmation-verbiage" dir="rtl">
                <template lwc:if={selectedCruise.bookingNotAvailableReason}>
                    {selectedCruise.bookingNotAvailableReason}
                </template>
                <template lwc:else>
                    {reachOutToClub}
                </template>
            </p>
        </template>
        <template lwc:else>
            <p class="booking-confirmation-verbiage" dir="rtl">
                {clubCruiseBookingLabel}
            </p>
        </template>
        <section class="footer-section">
            <template lwc:if={showConfirmButton}>
                <button class="slds-button slds-button_brand moderate-button search-button" onclick={handleConfirm}>
                    {confirm}
                </button>
            </template>
            <button class="slds-button slds-button_brand dark-button search-button" onclick={handleCloseModal}>
                {cancel}
            </button>
        </section>
    </section>
    <div class="slds-backdrop slds-backdrop_open" role="presentation"></div>
</template>
